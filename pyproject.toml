[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iia-benchmark-simplified"
version = "0.1.0"
description = "Task-oriented industrial alarm benchmark"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "pandas>=2", "scipy>=1.10"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
iia-benchmark = "iia_benchmark.runner:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-m 'not real_data'"
markers = ["real_data: explicit acceptance using local raw files (missing files fail)"]
